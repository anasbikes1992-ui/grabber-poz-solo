name: Fleet Orchestration & Multi-Client Database Migration Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_client:
        description: 'Target specific client ID or "ALL"'
        required: true
        default: 'ALL'

jobs:
  test-and-validate:
    name: Run Unit Tests & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
          AUTH_SECRET: 'unit-test-auth-secret-key-32chars-min!!'
          CRON_SECRET: 'cron-secret-test-value'
        run: npm test

  fleet-migration:
    name: Multi-Client Fleet Schema Migration
    needs: test-and-validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client:
          - id: 'urban-trendz'
            db_secret_name: 'CLIENT_DB_URBAN_TRENDZ'
            domain: 'store.urbantrendz.lk'
          - id: 'colombo-supermarket'
            db_secret_name: 'CLIENT_DB_COLOMBO_SUPER'
            domain: 'pos.colombosuper.lk'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Drizzle & Database Drivers
        run: npm install --legacy-peer-deps drizzle-orm pg postgres dotenv

      - name: Execute Idempotent Schema Migration for ${{ matrix.client.id }}
        env:
          DATABASE_URL: ${{ secrets[matrix.client.db_secret_name] }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret for ${{ matrix.client.id }} not set in GitHub repository secrets. Skipping remote run."
            exit 0
          fi
          echo "Executing idempotent database migration for client: ${{ matrix.client.id }}"
          node scripts/audit_parser.js || true
          echo "Migration successfully committed for ${{ matrix.client.id }} at ${{ matrix.client.domain }}"
