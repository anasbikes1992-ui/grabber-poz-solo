name: CI — Test & Build Image

# Deployments come from `main` only.
# - test-and-validate: runs on pushes to main/dev and PRs into main/dev.
# - build-and-push:    runs only for `main` (push or manual dispatch on main) and
#   publishes ghcr.io/<owner>/<repo>:sha-<short> (+ :main). GHCR-based tenants
#   pin a sha- tag and are promoted manually in Coolify; no image is ever
#   built from `dev` or any other branch.
# Coolify apps that build the Dockerfile themselves track `main` via Coolify's
# own git integration — this workflow does not trigger those deploys.
#
# History: this file used to run a "fleet-migration" job that executed
# `node scripts/audit_parser.js || true` (the file does not exist) and then
# unconditionally printed success. Migrations run per-tenant inside the tenant
# container (`node scripts/bootstrap-db.mjs`) — tenant databases are never
# reachable from a GitHub runner.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Run Unit Tests & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
          AUTH_SECRET: 'unit-test-auth-secret-key-32chars-min!!'
          CRON_SECRET: 'cron-secret-test-value'
        run: npm test

  build-and-push:
    name: Build & Push Image (main only)
    needs: test-and-validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only a fleet-wide, non-secret client value belongs here. Tenant
          # config and secrets are runtime env in Coolify, never build args.
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
