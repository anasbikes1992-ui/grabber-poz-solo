name: CI — Typecheck & Test

# Coolify deploys via its own git integration (see docs/COOLIFY_4_CLIENT_DEPLOYMENT_PLAYBOOK.md)
# — this workflow is a pre-deploy gate only, not a deploy trigger. It used to
# also run a "fleet-migration" job that installed drizzle-orm/pg/postgres,
# then ran `node scripts/audit_parser.js || true` (that file does not exist in
# this repo) against two clients (urban-trendz, colombo-supermarket) that
# appear nowhere else in the codebase, and unconditionally printed "Migration
# successfully committed" regardless of whether anything ran. It built and
# pushed no image despite the "Fleet Orchestration" name. Removed rather than
# fixed: migrations run per-tenant, inside that tenant's own container
# (`node scripts/bootstrap-db.mjs`, see the Coolify playbook) — the database
# is never reachable from outside its Docker network, so a GitHub Actions
# runner could not reach it even with real credentials.

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: Run Unit Tests & Invariant Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Run Vitest Suite
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/test_db'
          AUTH_SECRET: 'unit-test-auth-secret-key-32chars-min!!'
          CRON_SECRET: 'cron-secret-test-value'
        run: npm test
